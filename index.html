<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACT Math: Statistics & Probability</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:14px 18px;z-index:5}h1{margin:0 0 8px;font-size:1.35rem}.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:.95rem}.bar{height:8px;background:#e6e6e6;border-radius:99px;overflow:hidden;margin-top:10px}#progress{height:100%;width:0;background:#555}main{max-width:850px;margin:20px auto 90px;padding:0 14px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:16px}.qnum{font-weight:bold;margin-bottom:8px}.option{display:block;border:1px solid #ccc;border-radius:9px;padding:10px 12px;margin:8px 0;cursor:pointer}.option:hover{background:#f0f0f0}.option input{margin-right:10px}.controls{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:12px;text-align:center}button{padding:10px 18px;margin:4px;border-radius:8px;border:1px solid #aaa;background:#fff;cursor:pointer;font-size:1rem}button.primary{background:#222;color:#fff;border-color:#222}.correct{border-left:5px solid #2e7d32}.incorrect{border-left:5px solid #c62828}.exp{margin-top:10px;padding:10px;background:#f8f8f8;border-radius:8px;display:none}#results{background:#fff;border:1px solid #bbb;border-radius:12px;padding:18px;margin-bottom:18px;display:none}.score{font-size:1.4rem;font-weight:bold}.small{color:#555;font-size:.9rem}</style></head><body><header><h1>ACT Math: Statistics & Probability</h1><div class="meta"><span id="answered">Answered: 0 / 20</span><span id="timer">Time: 00:00</span></div><div class="bar"><div id="progress"></div></div></header><main><div id="results"></div><div id="quiz"></div></main><div class="controls"><button class="primary" onclick="gradeQuiz()">Grade Quiz</button><button onclick="resetQuiz()">Reset</button></div><script>const questions=[{"q": "Mean of 4,6,8,12?", "options": ["7", "7.5", "8", "9"], "answer": 1, "explanation": "30/4=7.5."}, {"q": "Median of 3,5,7,9,20?", "options": ["5", "7", "8", "9"], "answer": 1, "explanation": "Middle value is 7."}, {"q": "Mode of 2,3,3,4,4,4,5?", "options": ["3", "4", "5", "No mode"], "answer": 1, "explanation": "4 occurs most."}, {"q": "Range of 11,4,17,9,13?", "options": ["6", "8", "13", "17"], "answer": 2, "explanation": "17−4=13."}, {"q": "Fair die: P(rolling 5)?", "options": ["1/2", "1/3", "1/6", "5/6"], "answer": 2, "explanation": "One of six outcomes."}, {"q": "Bag has 3 red, 7 blue. P(red)?", "options": ["3/7", "3/10", "7/10", "1/3"], "answer": 1, "explanation": "3 out of 10."}, {"q": "Two fair coins: P(two heads)?", "options": ["1/2", "1/3", "1/4", "1/8"], "answer": 2, "explanation": "HH is 1 of 4 outcomes."}, {"q": "If P(A)=0.35, P(not A)=?", "options": ["0.35", "0.55", "0.65", "1.35"], "answer": 2, "explanation": "1−0.35=0.65."}, {"q": "12 boys, 18 girls. P(girl)?", "options": ["2/3", "3/5", "3/2", "18/12"], "answer": 1, "explanation": "18/30=3/5."}, {"q": "Ways to arrange 3 books?", "options": ["3", "6", "9", "27"], "answer": 1, "explanation": "3!=6."}, {"q": "Mean of 5 numbers is 12. Sum?", "options": ["17", "24", "60", "72"], "answer": 2, "explanation": "12×5=60."}, {"q": "Mean is 20. Adding a very large value usually:", "options": ["Decreases mean", "Increases mean", "Leaves unchanged", "Makes zero"], "answer": 1, "explanation": "High outlier pulls mean upward."}, {"q": "Least affected by extreme outlier?", "options": ["Mean", "Median", "Range", "Standard deviation"], "answer": 1, "explanation": "Median is resistant."}, {"q": "Scatterplot slopes downward. Indicates:", "options": ["Positive association", "Negative association", "No association", "Perfect causation"], "answer": 1, "explanation": "As x rises, y tends to fall."}, {"q": "40% of 250 students?", "options": ["80", "90", "100", "110"], "answer": 2, "explanation": "0.40×250=100."}, {"q": "P(A)=0.5, P(B)=0.4 independent. P(A and B)?", "options": ["0.1", "0.2", "0.45", "0.9"], "answer": 1, "explanation": "Multiply: 0.2."}, {"q": "50 of 200 prefer X. Percent?", "options": ["20%", "25%", "40%", "50%"], "answer": 1, "explanation": "50/200=25%."}, {"q": "Best graph for change over time?", "options": ["Pie chart", "Line graph", "Box plot", "Histogram"], "answer": 1, "explanation": "Line graph."}, {"q": "A box plot box shows mainly:", "options": ["Minimum to maximum", "Middle 50%", "Mean ±1 SD", "Only median"], "answer": 1, "explanation": "Q1 to Q3."}, {"q": "Two cards drawn without replacement from 5. P(specific first, then specific second)?", "options": ["1/5", "1/10", "1/20", "1/25"], "answer": 2, "explanation": "1/5×1/4=1/20."}];let seconds=0;const letters=['A','B','C','D'];function t(s){const m=Math.floor(s/60).toString().padStart(2,'0'),x=(s%60).toString().padStart(2,'0');return `${m}:${x}`}setInterval(()=>{seconds++;document.getElementById('timer').textContent='Time: '+t(seconds)},1000);function render(){const qd=document.getElementById('quiz');qd.innerHTML='';questions.forEach((q,i)=>{const c=document.createElement('div');c.className='card';c.id='card-'+i;c.innerHTML=`<div class="qnum">${i+1} of ${questions.length}</div><div><strong>${q.q}</strong></div>`+q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" onchange="updateProgress()"><strong>${letters[j]}.</strong> ${o}</label>`).join('')+`<div class="exp" id="exp-${i}"></div>`;qd.appendChild(c)});updateProgress()}function updateProgress(){let a=0;questions.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))a++});document.getElementById('answered').textContent=`Answered: ${a} / ${questions.length}`;document.getElementById('progress').style.width=(a/questions.length*100)+'%'}function gradeQuiz(){let c=0,a=0;questions.forEach((q,i)=>{const card=document.getElementById('card-'+i),p=document.querySelector(`input[name=q${i}]:checked`),e=document.getElementById('exp-'+i);card.classList.remove('correct','incorrect');if(p){a++;if(Number(p.value)===q.answer){c++;card.classList.add('correct')}else card.classList.add('incorrect')}else card.classList.add('incorrect');e.style.display='block';e.innerHTML=`<strong>Correct answer: ${letters[q.answer]}. ${q.options[q.answer]}</strong><br>${q.explanation}`});const pct=Math.round(c/questions.length*100),r=document.getElementById('results');r.style.display='block';r.innerHTML=`<div class="score">${c} / ${questions.length} = ${pct}%</div><div class="small">Answered ${a} of ${questions.length}. Review the explanations below, especially every missed question.</div>`;scrollTo({top:0,behavior:'smooth'})}function resetQuiz(){document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);document.querySelectorAll('.card').forEach(c=>c.classList.remove('correct','incorrect'));document.querySelectorAll('.exp').forEach(e=>e.style.display='none');document.getElementById('results').style.display='none';seconds=0;updateProgress();scrollTo({top:0,behavior:'smooth'})}render();</script></body></html>
